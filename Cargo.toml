[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
# Bump together with release.txt; the two must always agree.
version = "2.21.0+1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/philippevelha/verilog-a-sim"
# Nothing here is published to crates.io: the deliverable is the `va-cli` executable
# (release.txt, "Road to 1.0"), and the crates reference each other by path.
publish = false

# Shared dependency versions. Crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
faer = "0.22"
thiserror = "2"
logos = "0.15"
anyhow = "1"
# Pure-Rust port of musl's libm, for every transcendental that can reach a simulated number:
# same bits on every platform and thread (1.17.0; clippy.toml's disallowed-methods enforces it).
libm = "0.2"
# Thread pool for parallel device evaluation (va-core `par`). Also what `faer` builds on.
rayon = "1"
# SVG backend only (`default-features = false`): keeps the pure-Rust, no-native-deps posture
# (§5) — the bitmap backend pulls in font-rasterization deps for no benefit here. Decision
# recorded in docs/roadmap.md's Quarto-tutorials conventions.
# Cranelift, the pure-Rust code generator behind the compiled-model JIT (va-codegen `jit`, 2.18.0;
# docs/proposals/snn-transistor-performance.md §4.2). No native library: it emits machine code
# into memory it maps itself. `(Default features: the host ISA is detected at run time.)
cranelift-codegen = "0.131"
cranelift-frontend = "0.131"
cranelift-jit = "0.131"
cranelift-module = "0.131"
cranelift-native = "0.131"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series"] }

# Internal crates (path deps), referenced by sibling crates per the §3 table.
va-ir = { path = "crates/va-ir" }
va-abi = { path = "crates/va-abi" }
va-frontend = { path = "crates/va-frontend" }
va-codegen = { path = "crates/va-codegen" }
va-core = { path = "crates/va-core" }
va-transient = { path = "crates/va-transient" }
va-acnoise = { path = "crates/va-acnoise" }
va-netlist = { path = "crates/va-netlist" }
va-cli = { path = "crates/va-cli" }
va-harness = { path = "crates/va-harness" }

[profile.release]
opt-level = 3
