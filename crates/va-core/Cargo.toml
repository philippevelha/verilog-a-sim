[package]
name = "va-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "T3: MNA assembly, Newton, linear solve, and convergence (DC). Depends only on va-abi."

# CRITICAL INVARIANT (§2): va-core depends on va-abi (Interface β) and NOTHING ELSE.
# Do not add va-frontend / va-codegen here.
[dependencies]
va-abi = { workspace = true }
faer = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Test-only: runs the solve under rayon pools of different sizes (it is already in the build,
# through `faer`). Not a runtime dependency, so §2's va-abi-only invariant is untouched.
rayon = "1"
