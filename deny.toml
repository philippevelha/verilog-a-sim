# cargo-deny configuration.
#
# House rule (§5): pure-Rust numerics only. No `cgo`, no native-link / FFI deps
# (BLAS/LAPACK/KLU/SuiteSparse). Reproducible `cargo build` is a project requirement.
#
# Run with: cargo deny check

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (RUSTSEC-2024-0436). It reaches us only as a compile-time
    # proc-macro under faer's `gemm` kernels, has no runtime footprint, and has no drop-in
    # replacement upstream has adopted. Re-check when faer's gemm dependency changes.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro via faer/gemm; no upgrade exists" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", # atomic-wait, via spindle, via faer (first cargo-deny run, 2026-09-11)
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by `path` with no version; that is what a workspace
# looks like, not a `"*"` requirement on the registry.
allow-wildcard-paths = true
# Deny crates that exist solely to link a native library. Extend this list as the
# dependency tree grows; the intent is "no `-sys` / FFI shims sneak in".
deny = [
    { name = "openblas-src" },
    { name = "openblas-sys" },
    { name = "blas-src" },
    { name = "lapack-src" },
    { name = "lapack-sys" },
    { name = "intel-mkl-src" },
    { name = "netlib-src" },
    { name = "suitesparse-sys" },
    { name = "klu-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
