# Build, lint, test and validate on the three platforms 1.0 must run on.
#
# This is the mechanism behind the "tested on several platforms" 1.0 blocker (release.txt,
# "Road to 1.0"): every push and pull request runs the full gate -- fmt, clippy with warnings
# denied, the workspace tests, and `cargo xtask validate` against the committed QSPICE golden
# files -- on Windows, Linux and macOS. Golden outputs are committed, so validation needs no
# QSPICE on the runner. `cargo deny` enforces deny.toml (CLAUDE.md section 5: no native-link
# dependencies), which until 2026-09-11 was a file nobody ran.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # The version comes from rust-toolchain.toml; the action only makes sure it is installed
      # with the components the gate needs.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test
        # Every crate's verdict in one run: without this a failure in one test binary hides
        # whatever the later ones would have said, and a red run costs a full cycle to learn.
        run: cargo test --workspace --no-fail-fast
      - name: validate against committed golden
        run: cargo xtask validate
      - name: version agrees between Cargo.toml and release.txt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(sorted({p["version"] for p in json.load(sys.stdin)["packages"]})[0])')
          echo "workspace version: $v"
          grep -q "^$v - " release.txt || { echo "release.txt has no entry for $v"; exit 1; }

  # Road to 2.0 item 3: the same decks give the same bits on every platform. Each runner runs
  # deck-diff's deck set (plus c432's `.op` and c17's transient, the ISCAS'85 decks small enough
  # for CI) through its own release `va-cli`, one result file per deck (`cargo xtask deck-run`);
  # `repro-compare` then diffs the three trees (`cargo xtask deck-compare`). Decks whose model
  # is not committed (benchmark/README.md, "Deliberately left out") fail on every side and are
  # reported as such, not counted as matches.
  repro:
    name: repro run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: build va-cli (release)
        run: cargo build --release -p va-cli
      - name: run every deck
        shell: bash
        run: |
          exe=target/release/va-cli; [ -f "$exe.exe" ] && exe="$exe.exe"
          cargo xtask deck-run "$exe" repro-out \
            --include circuits/benchmark/iscas85/c432.net \
            --include circuits/benchmark/iscas85/c17_tran.net
          # What the runner was, for explaining a difference later: the CPU matters, because
          # faer picks SIMD kernels at run time (AVX2 / AVX-512 / NEON).
          rustc -vV > repro-out/host.info; uname -a >> repro-out/host.info
          cpu=$(grep -m1 "model name" /proc/cpuinfo 2>/dev/null | cut -d: -f2 \
            || true)
          [ -z "$cpu" ] && cpu=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)
          [ -z "$cpu" ] && cpu=$(powershell -NoProfile -Command \
            "(Get-CimInstance Win32_Processor).Name" 2>/dev/null || true)
          echo "cpu: $cpu" >> repro-out/host.info
          avx=$(grep -m1 -o "avx512f" /proc/cpuinfo 2>/dev/null || true)
          [ -z "$avx" ] && avx=$(powershell -NoProfile -Command \
            "[System.Runtime.Intrinsics.X86.Avx512F]::IsSupported" 2>/dev/null || true)
          echo "avx512f: ${avx:-unknown}" >> repro-out/host.info
      - uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.os }}
          path: repro-out
      # The three decks macOS arm64 differed on (1.30.0+2), rerun on the sparse path: if the
      # difference comes from faer's dense-LU SIMD kernels, it disappears here.
      - name: the macOS-differing decks, sparse path
        shell: bash
        run: |
          exe=target/release/va-cli; [ -f "$exe.exe" ] && exe="$exe.exe"
          cargo xtask deck-run "$exe" repro-sparse \
            --only circuits/benchmark/psp103_inverter_tran.net \
            --only circuits/benchmark/psp103_inverter_card_tran.net \
            --only circuits/benchmark/nand/bsimsoi.net \
            --va-arg --solver --va-arg sparse
      - uses: actions/upload-artifact@v4
        with:
          name: repro-sparse-${{ matrix.os }}
          path: repro-sparse

  repro-compare:
    name: repro compare (Linux vs Windows, Linux vs macOS)
    needs: repro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: repro
      - name: host info
        run: |
          head -n 30 repro/*/host.info
          for f in repro/*/host.info; do
            echo "::notice title=$(basename $(dirname $f))::$(grep -iE 'cpu:|^host:|avx' $f | tr '\n' ' ')"
          done
      # Each difference also becomes an annotation: readable without the job log, which needs
      # admin rights to download.
      - name: Linux vs Windows
        if: always()
        run: python3 .github/scripts/compare_annotate.py "Linux vs Windows" repro/repro-ubuntu-latest repro/repro-windows-latest
      - name: Linux vs macOS
        if: always()
        run: python3 .github/scripts/compare_annotate.py "Linux vs macOS" repro/repro-ubuntu-latest repro/repro-macos-latest
      - name: Linux vs macOS, sparse path
        if: always()
        run: python3 .github/scripts/compare_annotate.py "Linux vs macOS (sparse)" repro/repro-sparse-ubuntu-latest repro/repro-sparse-macos-latest

  deny:
    name: cargo deny (no native-link deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
